[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hampton-roads-flood-analysis"
version = "0.1.0"
description = "Python/PostGIS workflow for Hampton Roads flood analysis."
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.1",
    "geoalchemy2>=0.14",
    "geopandas>=0.14",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "psycopg[binary]>=3.1",
    "pyarrow>=14",
    "python-dotenv>=1.0",
    "rasterio>=1.3",
    "requests>=2.31",
    "scipy>=1.11",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
include = ["flood_analysis*"]
